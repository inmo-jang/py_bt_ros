scenario:
  environment: scenarios.limo_round_trip

agent:
  module: scenarios.limo_round_trip.agent
  namespaces: ""
  behavior_tree_xml: default_bt.xml

ros:
  node_name: limo_round_trip_bt
  use_sim_time: true

bt_runner:
  bt_tick_rate: 20.0
  bt_visualiser:
    enabled: true
    screen_width: 1000
    screen_height: 500
    direction: Horizontal
  profiling_mode: false

mission:
  goal_topic: /bt/goal_pose
  cancel_topic: /bt/cancel
  navigation_action: /navigate_to_pose
  global_frame: map
  odom_frame: odom
  robot_frame: base_link
  tf_max_age: 2.0
  server_timeout: 30.0
  navigation_timeout: 240.0
